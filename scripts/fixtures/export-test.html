<!doctype html>
<!-- builds a tiny named scene like a house design would, for scripts/model-check.mjs -->
<meta charset="utf-8" />
<script type="importmap">
  { "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
<script type="module">
  import * as THREE from 'three';
  const scene = new THREE.Scene();
  const mat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
  for (const [id, y] of [['ground', 0], ['first', 3]]) {
    const g = new THREE.Group();
    g.name = 'floor:' + id;
    const slab = new THREE.Mesh(new THREE.BoxGeometry(12, 0.2, 9), mat);
    slab.position.set(6, y - 0.1, -4.5);
    g.add(slab);
    scene.add(g);
  }
  scene.add(new THREE.AmbientLight(), new THREE.GridHelper(20, 20), new THREE.PerspectiveCamera());
  window.scene = scene;
  window.FLOORPLAN3D_THREE_URL = '/node_modules/three/build/three.module.js';
  window.FLOORPLAN3D_EXPORTER_URL = '/node_modules/three/examples/jsm/exporters/GLTFExporter.js';
  window.ready = true;
</script>
