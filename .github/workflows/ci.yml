name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # static checks, unit tests and the bundle: seconds; the slow part is the headless browser checks below,
  # so they run as parallel jobs (the critical path is the slowest one, not their sum)
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bun as pinned in mise.toml (a dated canary from npm, which setup-bun cannot pin)
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun lint
      - run: bun check
      - run: bun test --parallel
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: card
          path: |
            dist/floorplan3d-card.js
            dist/chunks/

  # demo screenshots, edit mode, perf (each retried once where timing on a slow shared runner can flake)
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: screenshot, run: bun scripts/screenshot.mjs }
          - { name: edit-check, run: bun scripts/edit-check.mjs }
          - { name: perf-check, run: 'bun scripts/perf-check.mjs || (echo "perf-check retry (slow shared runner timing)" && bun scripts/perf-check.mjs)' }
    name: browser (${{ matrix.check.name }})
    steps:
      - uses: actions/checkout@v4
      # bun as pinned in mise.toml (a dated canary from npm, which setup-bun cannot pin)
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: ${{ matrix.check.run }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.check.name }}
          path: screenshots/
          if-no-files-found: ignore

  # the model checks, one shard per section group (7 today; --shard k/7 takes every 7th group, so a new
  # group still runs, in a shard with another), each retried once on a slow shared runner
  model-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      # bun as pinned in mise.toml (a dated canary from npm, which setup-bun cannot pin)
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Model checks (shard ${{ matrix.shard }} of 7)
        run: bun scripts/model-check.mjs --shard ${{ matrix.shard }}/7 || (echo "model-check retry (slow shared runner timing)" && bun scripts/model-check.mjs --shard ${{ matrix.shard }}/7)
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-check-${{ matrix.shard }}
          path: screenshots/
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install Home Assistant test harness
        run: |
          uv pip install --system -r requirements-test.txt
          # the frontend package matching the installed core, needed by the frontend dependency
          FRONTEND=$(python -c "import json, importlib.resources as r; print(json.load(open(r.files('homeassistant') / 'components/frontend/manifest.json'))['requirements'][0])")
          uv pip install --system "$FRONTEND"
      - run: python -m pytest -q
