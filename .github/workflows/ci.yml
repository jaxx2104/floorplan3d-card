name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # static checks, unit tests and the bundle: seconds; the slow part is the headless browser checks below,
  # so they run as parallel jobs (the critical path is the slowest one, not their sum)
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bun as pinned in mise.toml (a dated canary from npm, which setup-bun cannot pin)
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun lint
      - run: bun fmt --check
      - run: bun check
      - run: bun test --parallel
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: card
          path: |
            dist/floorplan3d-card.js
            dist/chunks/

  # demo screenshots, edit mode
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: screenshot, run: bun scripts/screenshot.mjs }
          - { name: edit-check, run: bun scripts/edit-check.mjs }
    name: browser (${{ matrix.check.name }})
    steps:
      - uses: actions/checkout@v4
      # bun as pinned in mise.toml (a dated canary from npm, which setup-bun cannot pin)
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: ${{ matrix.check.run }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.check.name }}
          path: screenshots/
          if-no-files-found: ignore

  # the render loop's work by counters and condition waits (no frame-time budget), one shard per group pair
  # (--shard k/3 takes every 3rd group: mower-map + still, quality-standard + auto, quality-high)
  perf-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      # bun as pinned in mise.toml (a dated canary from npm, which setup-bun cannot pin)
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Perf checks (shard ${{ matrix.shard }} of 3)
        run: bun scripts/perf-check.mjs --shard ${{ matrix.shard }}/3
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # timing numbers (main-thread ms per map refresh, frame time per tier): a shared runner's timing is no verdict,
  # so this job reports and never fails the run
  perf-bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # bun as pinned in mise.toml (a dated canary from npm, which setup-bun cannot pin)
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/perf-check.mjs --only bench
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # the model checks, one shard per section group (8 today; --shard k/8 takes every 8th group, so a new
  # group still runs, in a shard with another)
  model-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      # bun as pinned in mise.toml (a dated canary from npm, which setup-bun cannot pin)
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Model checks (shard ${{ matrix.shard }} of 8)
        run: bun scripts/model-check.mjs --shard ${{ matrix.shard }}/8
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-check-${{ matrix.shard }}
          path: screenshots/
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install Home Assistant test harness
        run: |
          uv pip install --system -r requirements-test.txt
          # the frontend package matching the installed core, needed by the frontend dependency
          FRONTEND=$(python -c "import json, importlib.resources as r; print(json.load(open(r.files('homeassistant') / 'components/frontend/manifest.json'))['requirements'][0])")
          uv pip install --system "$FRONTEND"
      - run: python -m pytest -q
