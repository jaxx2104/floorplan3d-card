name: Release

# every green CI run on main releases the commits since the last tag (scripts/next-version.mjs);
# the version is stamped here, the repository keeps 0.0.0-dev
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Next version
        id: version
        run: |
          V=$(bun scripts/next-version.mjs)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "next version: ${V:-none (nothing to release)}"
      - run: bun install --frozen-lockfile
        if: steps.version.outputs.version
      - name: Stamp the version
        if: steps.version.outputs.version
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          bun pm pkg set version="$V"
          bun -e "const f='custom_components/floorplan3d/manifest.json',fs=require('fs'),m=JSON.parse(fs.readFileSync(f));m.version=process.env.V;fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n')"
          # either quote style (bun fmt writes double quotes)
          sed -i -E "s/^const VERSION = [\"'][^\"']*[\"'];/const VERSION = \"$V\";/" src/floorplan3d-card.ts
          grep -q "const VERSION = \"$V\";" src/floorplan3d-card.ts
      - run: bun run build
        if: steps.version.outputs.version
      # the card is an entry plus the chunks/ it imports on demand: both archives carry all of them
      - name: Package integration (card bundled inside) for HACS
        if: steps.version.outputs.version
        run: |
          test -f custom_components/floorplan3d/frontend/floorplan3d-card.js
          ls custom_components/floorplan3d/frontend/chunks/*.js
          cd custom_components/floorplan3d
          zip -r "$GITHUB_WORKSPACE/floorplan3d.zip" . -x '__pycache__/*'
      - name: Package the card alone (dashboard resource without the integration)
        if: steps.version.outputs.version
        run: tar -czf floorplan3d-card.tar.gz -C dist floorplan3d-card.js chunks
      - name: Create release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" floorplan3d.zip floorplan3d-card.tar.gz \
            --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes
